<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Result</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .result-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .success-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        .success {
            color: #4CAF50;
        }
        .error {
            color: #f44336;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="result-container">
        {% if success %}
            <div class="success-icon success">✓</div>
            <h1>Success!</h1>
            <p>{{ message }}</p>
            <p>You can now close this window and return to your calendar.</p>
        {% else %}
            <div class="success-icon error">✗</div>
            <h1>Authentication Failed</h1>
            <p>{{ message }}</p>
        {% endif %}
        <a href="/" class="btn">Return to Calendar</a>
    </div>
    
    <script>
        // Auto-close and refresh parent window after 3 seconds on success
        {% if success %}
        setTimeout(() => {
            if (window.opener) {
                window.opener.location.reload();
                window.close();
            } else {
                window.location.href = '/';
            }
        }, 3000);
        {% endif %}
    </script>
</body>
</html>
